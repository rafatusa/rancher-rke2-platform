name: validation
'on':
  workflow_dispatch: {}
jobs:
  k8s_health:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_aws_region: us-east-1
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_wrapper: false
    - name: Terraform init
      run: "terraform init -input=false -reconfigure \\\n  -backend-config=\"bucket=${{\
        \ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=us-east-1\"\n"
      working-directory: infra
    - id: tfout
      name: Read master IP
      run: echo "master_ip=$(terraform output -raw master_public_ip)" >> "$GITHUB_OUTPUT"
      working-directory: infra
    - name: Write SSH key
      run: 'mkdir -p ~/.ssh

        printf ''%s\n'' "$SSH_KEY" > ~/.ssh/deploy_key

        chmod 600 ~/.ssh/deploy_key

        ssh-keyscan -T 20 -H "$MASTER_IP" >> ~/.ssh/known_hosts

        '
      env:
        SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        MASTER_IP: ${{ steps.tfout.outputs.master_ip }}
    - name: Nodes Ready, pods Running, Helm releases healthy, Rancher up
      run: ssh -i ~/.ssh/deploy_key "$SSH_USER@$MASTER_IP" "sudo /usr/local/bin/cluster-health.sh"
      env:
        SSH_USER: ${{ secrets.SSH_USER }}
        MASTER_IP: ${{ steps.tfout.outputs.master_ip }}
  smoke:
    runs-on: ubuntu-latest
    needs:
    - k8s_health
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_aws_region: us-east-1
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.10.2
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_wrapper: false
    - name: Terraform init
      run: "terraform init -input=false -reconfigure \\\n  -backend-config=\"bucket=${{\
        \ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=us-east-1\"\n"
      working-directory: infra
    - id: tfout
      name: Read master IP
      run: echo "master_ip=$(terraform output -raw master_public_ip)" >> "$GITHUB_OUTPUT"
      working-directory: infra
    - name: Smoke tests
      run: 'chmod +x scripts/smoke-test.sh

        ./scripts/smoke-test.sh "$MASTER_IP"

        '
      env:
        MASTER_IP: ${{ steps.tfout.outputs.master_ip }}
    - name: REST Assured API and integration tests
      run: gradle --no-daemon integrationTest -Papi.base.url="http://api.${MASTER_IP}.sslip.io"
      working-directory: app
      env:
        MASTER_IP: ${{ steps.tfout.outputs.master_ip }}
    - name: Upload integration test report
      uses: actions/upload-artifact@v4
      with:
        name: integration-test-report
        path: app/build/reports/tests/integrationTest
  load:
    runs-on: ubuntu-latest
    needs:
    - smoke
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_aws_region: us-east-1
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_wrapper: false
    - name: Terraform init
      run: "terraform init -input=false -reconfigure \\\n  -backend-config=\"bucket=${{\
        \ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=us-east-1\"\n"
      working-directory: infra
    - id: tfout
      name: Read master IP
      run: echo "master_ip=$(terraform output -raw master_public_ip)" >> "$GITHUB_OUTPUT"
      working-directory: infra
    - name: Install k6
      run: 'curl -fsSL https://github.com/grafana/k6/releases/download/v0.54.0/k6-v0.54.0-linux-amd64.tar.gz
        -o /tmp/k6.tar.gz

        tar -xzf /tmp/k6.tar.gz -C /tmp

        sudo install /tmp/k6-v0.54.0-linux-amd64/k6 /usr/local/bin/k6

        k6 version

        '
    - name: k6 load test
      run: k6 run -e BASE_URL="http://api.${MASTER_IP}.sslip.io" tests/k6/load-test.js
      env:
        MASTER_IP: ${{ steps.tfout.outputs.master_ip }}
