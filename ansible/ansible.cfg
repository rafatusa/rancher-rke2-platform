[defaults]
host_key_checking = False
inventory = inventory.ini
roles_path = roles
# Use ansible-core's NATIVE yaml result formatting rather than the
# community.general.yaml callback plugin. That plugin was removed in
# community.general 12.0.0, and an unqualified `stdout_callback = yaml`
# resolves to it — which aborts the run at startup before any task executes.
# result_format has provided the same output since ansible-core 2.13.
stdout_callback = default
result_format = yaml
timeout = 60
retry_files_enabled = False
interpreter_python = /usr/bin/python3
deprecation_warnings = False

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o ServerAliveInterval=30
